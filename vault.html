<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vault — Parivar Pass v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../core/tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="topnav">
      <a href="index.html">← Parivar Pass v2</a>
      <a href="print.html">Print batch</a>
      <a href="admin.html">Admin desk</a>
    </nav>
    <main class="wide">
      <p class="mode-pill" id="mode-pill"></p>
      <p class="eyebrow">Staff only</p>
      <h1>Mint vault</h1>
      <p class="lede">
        Batches saved to Google Drive when you Generate. Open the print HTML to
        re-print / Save as PDF anytime.
      </p>
      <p id="status" class="status hidden" role="status"></p>

      <section class="panel" id="auth-panel">
        <h2>Staff PIN</h2>
        <label>PIN <input id="admin-pin" type="password" autocomplete="current-password" /></label>
        <div class="btn-row">
          <button type="button" id="unlock">Unlock</button>
        </div>
        <p class="hint" id="pin-hint"></p>
      </section>

      <section class="panel hidden" id="vault-panel">
        <h2>Batches</h2>
        <p class="hint">
          <a id="vault-root" href="#" target="_blank" rel="noopener">Open vault folder</a>
        </p>
        <div id="batch-list"></div>
        <h2 style="margin-top: 1.25rem">All passes</h2>
        <div id="pass-list"></div>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="demo-store.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="vault.js"></script>
  </body>
</html>
